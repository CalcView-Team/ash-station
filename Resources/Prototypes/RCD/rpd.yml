# RPD (Rapid Piping Device) operations.
# These reuse the RCD system: each entry is a ConstructObject operation that
# spawns an atmospherics entity. Pipe layer (Primary / Secondary / Tertiary) is
# picked with the mouse via AlignAtmosPipeLayers, so there is no need for a
# separate operation per layer.
#
# Categories must match the keys in RCDMenuBoundUserInterface.PrototypesGroupingInfo,
# otherwise the entry is silently dropped from the radial menu.
#
# CollisionMask is None because pipes/devices have canCollide: false; overlap
# between conflicting pipe directions/layers is handled by PipeRestrictOverlap.

# === Pipes ===
- type: rcd
  id: RPDPipeStraight
  category: Pipes
  sprite:
    sprite: Structures/Piping/Atmospherics/pipe.rsi
    state: pipeStraight
  mode: ConstructObject
  prototype: GasPipeStraight
  cost: 1
  delay: 1
  rotation: User
  fx: EffectRCDConstruct1
  allowMultiDirection: true

