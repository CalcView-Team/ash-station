  name: reagent-name-nitrium
  desc: reagent-desc-nitrium
  physicalDesc: reagent-physical-desc-gaseous
  flavor: sour
  color: "#a52a2a"
  metabolisms:
    Respiration:
      effects:
      # Boosts movement speed, but poisons and exhausts at high concentrations.
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.25
        sprintSpeedModifier: 1.25
      - !type:ModifyStatusEffect
        minScale: 2
        effectProto: StatusEffectStutter
        type: Add
        time: 8
      - !type:HealthChange
        minScale: 3
        ignoreResistances: true
        scaling: true
        damage:
          types:
            Asphyxiation: 1.5
            Poison: 1

