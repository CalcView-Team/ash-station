# Assmos - /tg/ gases

- type: reagent
  id: BZ
  name: reagent-name-bz
  desc: reagent-desc-bz
  physicalDesc: reagent-physical-desc-gaseous
  flavor: bitter
  color: "#9370db"
  metabolisms:
    Respiration:
      effects:
      # Behaves like a hallucinogenic narcotic when breathed by most creatures.
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 9
      - !type:Drunk
        boozePower: 20
      - !type:Emote
        minScale: 0.2
        emote: Laugh
        showInChat: true
        probability: 0.1
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "effect-sleepy" ]
        probability: 0.1
        minScale: 0.5
      - !type:HealthChange
        minScale: 3
        ignoreResistances: true
        scaling: true
        damage:
          types:
            Cellular: 0.5

- type: reagent
  id: Healium
  name: reagent-name-healium
  desc: reagent-desc-healium
  physicalDesc: reagent-physical-desc-gaseous
  flavor: strange
  color: "#fa8072"
  metabolisms:
    Respiration:
      effects:
      # Heals physical, burn and toxin damage, but knocks the patient out in large amounts.
      - !type:HealthChange
        ignoreResistances: true
        scaling: true
        damage:
          groups:
            Brute: -2
            Burn: -2
          types:
            Poison: -5
      - !type:Drunk
        boozePower: 35
        minScale: 1
      - !type:ModifyStatusEffect
        minScale: 3
        effectProto: StatusEffectForcedSleeping
        type: Add
        time: 3

- type: reagent
